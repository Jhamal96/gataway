<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | The Getaway Crew</title><style>:root{font:16px system-ui;color-scheme:dark;background:#0d1425;color:#fff}body{max-width:540px;margin:5vh auto;padding:20px}main{background:#17233a;border:1px solid #35445e;border-radius:18px;padding:26px}label{display:block;margin:15px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #71829c;background:#101c2d;color:white}button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#70d8bb;color:#10251f;font-weight:bold}a{color:#70d8bb}p{color:#c3cfdf}</style><main><h1>✈ The Getaway Crew 2.0</h1><h2>Create your Traveler account</h2><form id="form"><label for="name">Full name</label><input id="name" autocomplete="name" required maxlength="100"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="username">Preferred username (optional)</label><input id="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}"><p>Username sign-in will become available after secure username lookup is connected. For now, sign in with email.</p><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" required><button id="submit">Create account</button></form><p id="status" role="status" aria-live="polite"></p><a href="/email-signin.html">Already have an account? Sign in</a></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://mgehamvbkugwctdcmqcp.supabase.co','sb_publishable_36ZFrrvF0SALg27Pg2RKBA_U59eJTF-');const $=id=>document.getElementById(id);const approved=()=>location.protocol==='https:'&&location.hostname==='getaway-crew-2-dev.pages.dev';$('form').onsubmit=async e=>{e.preventDefault();if(!approved())return $('status').textContent='Only available on the development website.';if($('password').value!==$('confirm').value)return $('status').textContent='Passwords do not match.';$('submit').disabled=true;try{const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+'/verify-email.html',data:{full_name:$('name').value.trim(),preferred_username:$('username').value.trim()}}});if(error)throw error;if(data.session)await sb.auth.signOut();$('status').textContent='Check your email for the confirmation link. After verifying, return to Sign In.';}catch(err){$('status').textContent=err.message||'Could not create account.'}finally{$('submit').disabled=false}};</script></html>
