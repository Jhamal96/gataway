<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Email Verification — The Getaway Crew</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0d1425;color:#f4f7ff}body{max-width:540px;margin:8vh auto;padding:20px}main{background:#17233a;border:1px solid #35445e;border-radius:20px;padding:30px;text-align:center}a{display:inline-block;padding:13px 18px;border-radius:10px;background:#70d8bb;color:#0b231b;font-weight:700;text-decoration:none;margin:10px}p{color:#c3cfdf}#status{min-height:4em}</style></head><body><main><h1>✈ The Getaway Crew 2.0</h1><h2>Email verification</h2><p id="status" role="status" aria-live="polite">Checking your confirmation link…</p><a id="continue" href="/traveler-dashboard.html" hidden>Continue to Dashboard</a><p id="countdown" aria-live="polite"></p><a href="/email-signin.html">Go to Sign In</a><a href="/signup.html">Create an Account</a></main><script type="module">
import {sb} from './auth-client.js';

const status=document.getElementById('status');
async function check(){try{const u=new URL(location.href);const code=u.searchParams.get('code');const token_hash=u.searchParams.get('token_hash');const type=u.searchParams.get('type');const error=u.searchParams.get('error_description')||u.searchParams.get('error');if(error)throw Error(error);if(code){const r=await sb.auth.exchangeCodeForSession(code);if(r.error)throw r.error}else if(token_hash&&['signup','magiclink','email','recovery','invite'].includes(type)){const r=await sb.auth.verifyOtp({token_hash,type});if(r.error)throw r.error}const {data,error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;status.textContent=data.session?'Welcome to The Getaway Crew, '+(data.session.user?.user_metadata?.full_name||'Traveler')+'! Your email is verified.':'If you already confirmed your email, return to Sign In to access your account. If this link expired, request a new one.';if(data.session){await sb.auth.signOut();document.getElementById('continue').href='/email-signin.html';document.getElementById('continue').textContent='Continue to Sign In';document.getElementById('continue').hidden=false;let seconds=5;const countdown=document.getElementById('countdown');countdown.textContent='Redirecting to Sign In in '+seconds+' seconds…';const timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);location.assign('/email-signin.html')}else countdown.textContent='Redirecting to Sign In in '+seconds+' seconds…'},1000)}history.replaceState({},'',location.pathname)}catch(e){status.textContent='Verification could not be completed: '+(e.message||'Invalid or expired link')+'. Please request a fresh email.';history.replaceState({},'',location.pathname)}}check();
</script></body></html>
