<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#146d73"><title>The Getaway Crew</title><meta name="description" content="Plan together. Go together. Make memories."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;background:#f7f5ef;color:#153c40;font-family:system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:25px;font-weight:600}.brand span{color:#d38a5d}.panel{background:#fffdf8;border:1px solid #d8e3df;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 12px 30px #16484b12}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(32px,6vw,56px)}button,.btn{background:#146d73;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;display:inline-block;text-decoration:none}button.alt,.btn.alt{background:#e9f1ee;color:#155c62}button:disabled{opacity:.55;cursor:wait}input,textarea,select{width:100%;padding:12px;border:1px solid #bfd1cb;border-radius:11px;background:#fff;color:#163c40;font:inherit}label{display:block;margin:13px 0 6px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#607c7b;font-size:14px;line-height:1.5}.eyebrow{color:#bd7951;font-weight:700;letter-spacing:.16em;font-size:11px;text-transform:uppercase}.hidden{display:none!important}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap}.badge{display:inline-block;background:#e1f0e8;color:#17645f;border-radius:30px;padding:6px 12px;font-size:13px}.error{color:#a72c36;white-space:pre-wrap}.success{color:#146d73}.stack{display:grid;gap:12px}a{color:#176b73;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:650}.small{font-size:12px}dialog{max-width:620px;width:calc(100% - 36px);border:1px solid #d5e2de;border-radius:20px;padding:22px;background:#fffdf8;color:#143d42;max-height:90vh;overflow:auto}dialog::backdrop{background:#0e363b99}footer{text-align:center;color:#63807e;font-size:12px;padding:30px}
</style></head><body><div class="wrap"><header><div class="brand">✧ The <span>Getaway</span> Crew</div><nav class="actions"><button class="alt" id="install">↓ Install</button><button class="alt hidden" id="settings">⚙ Settings</button><button class="alt hidden" id="logout">Log out</button></nav></header><main id="root"><div class="panel">Loading your getaway…</div></main><footer>Plan together · Go together · Make memories</footer></div><dialog id="modal"><div id="modalBody"></div><div class="actions" style="margin-top:15px"><button class="alt" id="closeModal">Close</button></div></dialog><script type="module" src="/independent.js"></script></body></html>
